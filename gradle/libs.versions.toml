[versions]
agp = "7.4.2"
kotlin = "1.8.22"
ksp = "1.8.22-1.0.11"
composeCompiler = "1.4.8"
coreKtx = "1.12.0"
lifecycle = "2.6.2"
activityCompose = "1.8.2"
biometric = "1.1.0"
